<div class="flex h-screen bg-gray-100">

    <!-- Sidebar -->
    <div class="bg-white shadow-md border-r transition-all duration-300 h-full" [class.w-60]="sidebarOpen"
        [class.w-16]="!sidebarOpen">
        <div class="h-16 flex items-center px-4 border-b">
            <button pButton icon="pi pi-bars" class="p-button-text" (click)="toggleSidebar()"></button>
            <span *ngIf="sidebarOpen" class="ml-3 font-bold text-gray-700">Mi App</span>
        </div>

        <ul class="mt-3">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="item.routerLink"
                    class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-200 transition rounded-md">
                    <i [class]="item.icon"></i>
                    <span *ngIf="sidebarOpen">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Contenido -->
    <div class="flex-1 flex flex-col h-full">

        <!-- Navbar superior -->
        <app-navbar></app-navbar>

        <!-- View -->
        <main class="p-6 bg-gray-50 flex-1 overflow-auto">
            <router-outlet></router-outlet>
        </main>

    </div>
</div>
