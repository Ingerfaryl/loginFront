<div class="flex h-screen bg-gray-100 relative overflow-hidden">

  <!-- Sidebar -->
  <div class="fixed md:relative z-50 bg-slate-700 text-white shadow-md transition-all duration-300 h-full flex-shrink-0"
       [class.w-60]="sidebarOpen"
       [class.w-16]="!sidebarOpen">
    
    <div class="h-16 flex items-center px-2">
      <button pButton icon="pi pi-bars"
              class="p-button-text flex-shrink-0 !text-white hover:bg-white/10"
              (click)="toggleSidebar()">
      </button>
      <span class="ml-3 font-semibold text-white transition-opacity duration-300 whitespace-nowrap"
            [class.opacity-100]="sidebarOpen"
            [class.opacity-0]="!sidebarOpen"
            [class.pointer-events-none]="!sidebarOpen">
        Mi App
      </span>
    </div>

    <ul class="mt-3 px-2">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.routerLink"
           class="flex items-center gap-3 px-3 py-3 text-white hover:bg-white/10 transition rounded-md">
          <i [class]="item.icon" class="flex-shrink-0"></i>
          <span class="transition-opacity duration-300 whitespace-nowrap"
                [class.opacity-100]="sidebarOpen"
                [class.opacity-0]="!sidebarOpen"
                [class.pointer-events-none]="!sidebarOpen">
            {{ item.label }}
          </span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Overlay móvil -->
  <div *ngIf="sidebarOpen"
       class="fixed inset-0 bg-black/50 z-40 md:hidden"
       (click)="sidebarOpen = false">
  </div>

  <!-- Contenido principal — reemplaza tu div actual -->
  <div class="flex-1 flex flex-col min-w-0 md:ml-0"
       [ngClass]="{'ml-16': true}">

    <app-navbar></app-navbar>

    <main class="flex-1 bg-gray-50 p-6 overflow-y-auto overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
