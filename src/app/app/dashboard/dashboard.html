<div class="flex h-screen bg-gray-100 relative overflow-hidden">

  <div class="fixed md:relative z-50 bg-slate-700 text-white shadow-md transition-all duration-300 h-full flex-shrink-0 overflow-hidden"
       [class.w-60]="sidebarOpen"
       [class.w-0]="!sidebarOpen">
    
    <div class="h-16 flex items-center justify-center px-2 border-b border-white/10">
      <span class="font-semibold text-white whitespace-nowrap">
        Mi App
      </span>
    </div>

    <ul class="mt-3 px-2">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.routerLink"
           class="flex items-center gap-3 px-3 py-3 text-white hover:bg-white/10 transition rounded-md">
          <i [class]="item.icon" class="flex-shrink-0"></i>
          <span class="whitespace-nowrap">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>

  <div *ngIf="sidebarOpen"
       class="fixed inset-0 bg-black/50 z-40 md:hidden"
       (click)="sidebarOpen = false">
  </div>

  <div class="flex-1 flex flex-col min-w-0">

    <app-navbar (onToggleSidebar)="toggleSidebar()"></app-navbar>

    <main class="flex-1 bg-gray-50 p-6 overflow-y-auto overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
