<p-card header="Orden de Compra" class="p-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- <div>
            <label class="block mb-1 font-semibold">Emisor</label>
            <input pInputText [(ngModel)]="filtro.emisor" class="w-full" />
        </div> -->
        <div>
            <label class="block mb-1 font-semibold">Tipo Documento</label>
            <p-select [options]="tiposDocumento" [(ngModel)]="selectedTipoDocumento" optionLabel="name"
                optionValue="value" placeholder="Seleccione tipo documento" class="w-full">
            </p-select>
        </div>

        <div>
            <label class="block mb-1 font-semibold">Proveedor</label>

            <p-select [options]="proveedores" [(ngModel)]="filtro.proveedor" optionLabel="Proveedor"
                optionValue="CodigoCliente" [filter]="true" filterBy="Proveedor" [showClear]="true"
                placeholder="Seleccione proveedor" class="w-full" appendTo="body" [virtualScroll]="true"
                [virtualScrollItemSize]="38">
            </p-select>
        </div>
        <div>
            <label class="block mb-1 font-semibold">Mes</label>
            <p-datepicker [(ngModel)]="filtro.mes" view="month" dateFormat="mm/yy" class="w-full">
            </p-datepicker>
        </div>
        <div class="flex items-end">
            <p-button label="Buscar" (onClick)="buscar()" [loading]="cargando" class="w-full"></p-button>
        </div>

    </div>
</p-card>

<p-card class="mt-4" *ngIf="haBuscado">
  <p-table [value]="lista" [columns]="cols" [paginator]="true" [rows]="5" [scrollable]="true"
    [loading]="cargando" [rowsPerPageOptions]="[5, 10, 20]">

    <ng-template pTemplate="header" let-columns>
      <tr>
        <th *ngFor="let col of columns">{{ col.header }}</th>
        <!-- Acciones solo si hay resultados -->
        <th *ngIf="lista.length > 0">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row let-columns="columns">
      <tr>
        <td *ngFor="let col of columns">
          {{ formatearValor(row[col.field], col.field) }}
        </td>
        <td>
          <button pButton type="button" label="Ver detalle" (click)="verDetalle(row)"></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage" let-columns>
      <tr>
        <!-- Solo las columnas de datos, sin la de Acciones -->
        <td [attr.colspan]="cols.length" class="text-center">
          No se encontraron resultados.
        </td>
      </tr>
    </ng-template>

  </p-table>
</p-card>

<p-dialog header="Detalle de Orden" [(visible)]="displayModal" [modal]="true" [style]="{ width: '70vw' }"
    [draggable]="false" [resizable]="false">

    <p-table [value]="detalle" [loading]="cargandoDetalle" [scrollable]="true">

        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let col of columnasDetalle">{{ col }}</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
            <tr>
                <td *ngFor="let col of columnasDetalle">
                    {{ formatearValor(row[col], col) }}
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td [attr.colspan]="columnasDetalle.length" class="text-center">
                    No hay registros para mostrar.
                </td>
            </tr>
        </ng-template>

    </p-table>
</p-dialog>
