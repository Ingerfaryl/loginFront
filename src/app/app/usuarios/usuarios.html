<p-card class="w-full mx-auto m-6" header="Registro de Usuario">

  <div class="flex flex-col gap-4 mt-2">

    <!-- ✅ Grid de inputs -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-5">

      <div class="w-full">
        <p-floatlabel variant="on">
          <input pInputText id="txtNombre" [(ngModel)]="Nombres" autocomplete="off" class="w-full" />
          <label for="txtNombre">Nombres</label>
        </p-floatlabel>
      </div>

      <div class="w-full">
        <p-floatlabel variant="on">
          <input pInputText id="txtApellidoP" [(ngModel)]="ApellidoP" autocomplete="off" class="w-full" />
          <label for="txtApellidoP">Apellido Paterno</label>
        </p-floatlabel>
      </div>

      <div class="w-full">
        <p-floatlabel variant="on">
          <input pInputText id="txtApellidoM" [(ngModel)]="ApellidoM" autocomplete="off" class="w-full" />
          <label for="txtApellidoM">Apellido Materno</label>
        </p-floatlabel>
      </div>

      <div class="w-full">
        <p-floatlabel variant="on">
          <p-inputNumber inputId="txtTelefono" [(ngModel)]="Telefono" [useGrouping]="false" [maxFractionDigits]="0"
            class="w-full">
          </p-inputNumber>
          <label for="txtTelefono">Teléfono</label>
        </p-floatlabel>
      </div>

      <div class="w-full">
        <p-floatlabel variant="on">
          <input pInputText id="txtUsuario" [(ngModel)]="Usuario" autocomplete="off" class="w-full" />
          <label for="txtUsuario">Usuario</label>
        </p-floatlabel>
      </div>

      <div class="w-full">
        <p-floatlabel variant="on">
          <input pInputText type="password" id="txtContrasena" [(ngModel)]="Contrasena" autocomplete="off"
            class="w-full" />
          <label for="txtContrasena">Contraseña</label>
        </p-floatlabel>
      </div>

      <div class="w-full md:col-span-2">
        <p-floatlabel variant="on">
          <input pInputText id="txtCorreo" [(ngModel)]="correo" autocomplete="off" class="w-full" />
          <label for="txtCorreo">Correo</label>
        </p-floatlabel>
      </div>

      <!-- ✅ Select -->
      <div class="w-full md:col-span-2">
        <p-select [options]="perfiles" [(ngModel)]="perfilSeleccionado" (onChange)="onPerfilChange($event)"
          optionLabel="perfil" optionValue="idPerfil" placeholder="Selecciona un perfil" class="w-full">
        </p-select>
      </div>

    </div>

    <!-- ✅ Botón -->
    <div class="flex justify-end pt-2">
      <button pButton label="Agregar Usuario" icon="pi pi-plus" class="p-button-success" (click)="agregarUsuario()">
      </button>
    </div>

  </div>

</p-card>
