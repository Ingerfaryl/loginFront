<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0a0a0f] to-[#1a1f3c] px-4"
>
  <p-toast></p-toast>

  <div class="w-full max-w-md bg-[#161616] border border-[#262626] rounded-2xl p-10 shadow-2xl">
    <!-- Título -->
    <h1 class="text-3xl font-semibold text-white text-center mb-2 tracking-wide">Iniciar Sesión</h1>
    <p class="text-gray-400 text-center mb-8 text-sm">Ingresa tus credenciales para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Usuario -->
      <div>
        <label class="text-gray-300 text-sm mb-1 block">Usuario</label>

        <div class="relative">
          <input
            pInputText
            type="text"
            formControlName="username"
            class="w-full !bg-[#0c0c0c] !text-white !border !border-[#2a2a2a] focus:!border-blue-600 focus:!ring-0 transition-all pl-4 py-3 !rounded-lg !outline-none"
          />
        </div>

        <p-message *ngIf="isInvalid('username')" severity="error" size="small" variant="simple">
          Complete su usuario
        </p-message>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="text-gray-300 text-sm mb-1 block">Contraseña</label>

        <div class="relative">
          <p-password
            formControlName="password"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full !bg-[#0c0c0c] !text-white !border !border-[#2a2a2a] 
                             focus:!border-blue-600 focus:!ring-0 transition-all 
                             pl-4 py-3 !rounded-lg !outline-none"
          ></p-password>
        </div>

        <p-message *ngIf="isInvalid('password')" severity="error" size="small" variant="simple">
          Complete su contraseña
        </p-message>
      </div>

      <!-- Botón -->
      <p-button type="submit" [disabled]="loginForm.invalid" class="w-full primary" severity="secondary"> Entrar </p-button>
    </form>
  </div>
</div>
